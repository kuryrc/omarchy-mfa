name: Quality and regression tests
on: [push, pull_request]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: python -B -m unittest discover -s tests -v

  qml:
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
      - name: Install Qt and Quickshell
        run: pacman -Syu --noconfirm --needed git python quickshell qt6-declarative qt6-svg ttf-dejavu dbus
      - uses: actions/checkout@v4
      - name: Fetch the tested Omarchy UI components
        uses: actions/checkout@v4
        with:
          repository: basecamp/omarchy
          ref: 0534987009061cbe2dacdde4ad564092ab698d12 # v4.0.3
          path: .ci-omarchy
          persist-credentials: false
      - name: QML and JavaScript formatting
        run: python -B scripts/check_qml_format.py
      - name: Offscreen UI regressions
        shell: bash
        run: |
          export OMARCHY_SHELL_DIR="$GITHUB_WORKSPACE/.ci-omarchy/shell"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/mfa-runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          dbus-run-session -- python -B tests/check_ui_refresh.py
          dbus-run-session -- python -B tests/check_backup_ui.py
          dbus-run-session -- python -B tests/check_paste_ui.py
