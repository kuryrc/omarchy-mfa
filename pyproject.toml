[project]
name = "omarchy-mfa"
version = "1.0.0"
requires-python = ">=3.12"
description = "Native Omarchy MFA overlay (QML + Python)"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
files = ["backend"]
python_version = "3.12"
strict = true
mypy_path = "backend"

[[tool.mypy.overrides]]
module = ["gi", "gi.*"]
ignore_missing_imports = true
